<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter-Anmeldung bestätigt | Smart Remote Life</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://smart-remote-life.com/newsletter-bestaetigt.html">
<style>
:root{--ink:#102033;--muted:#5f6d84;--blue:#2f80ed;--paper:#fffdfb}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);background:
    linear-gradient(rgba(70,145,180,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,145,180,.04) 1px,transparent 1px),
    radial-gradient(circle at 4% 0%,rgba(154,215,255,.34),transparent 30%),
    radial-gradient(circle at 96% 4%,rgba(201,184,255,.24),transparent 27%),
    linear-gradient(135deg,#fffdfb,#f7f5ff 42%,#effaff);
  background-size:38px 38px,38px 38px,auto,auto,auto;
}
.page{width:min(760px,calc(100% - 28px));margin:0 auto;padding:24px 0 54px}
.logo{display:block;width:min(360px,72vw);height:auto;margin-bottom:24px}
.status-card{
  padding:clamp(26px,6vw,52px);border-radius:30px;background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.95);box-shadow:0 24px 70px rgba(16,32,51,.12);text-align:center;
}
.status-mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;border-radius:50%;background:#e7faf0;color:#16804b;font-size:1.75rem;font-weight:900}
h1{margin:0 0 14px;font-size:clamp(2rem,7vw,3.25rem);letter-spacing:-.045em;line-height:1.05}
p{margin:0 auto 12px;max-width:570px;color:var(--muted);font-size:1.05rem;line-height:1.65}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:18px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,#244b94,#3d80d3 68%,#7fc8ef);color:#fff;font-weight:800;text-decoration:none}
.button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:520px){.page{padding-top:14px}.logo{width:min(280px,68vw);margin-bottom:16px}.status-card{border-radius:24px}.button{width:100%}}
</style>
</head>
<body>
<main class="page">
  <img class="logo" src="smart-remote-life-logo-header.png" alt="Smart Remote Life" width="2048" height="682" fetchpriority="high">
  <section class="status-card" aria-labelledby="page-title">
    <span class="status-mark" aria-hidden="true">✓</span>
    <h1 id="page-title">Danke – deine Anmeldung ist bestätigt.</h1>
    <p>Du bist jetzt beim Smart Remote Life Newsletter dabei.</p>
    <a class="button" href="index.html">Zurück zu Smart Remote Life</a>
  </section>
</main>
</body>
</html>
